x-prefect-environment: &prefect-environment
  PREFECT_API_AUTH_STRING: "${PREFECT_API_AUTH_STRING:?Set PREFECT_API_AUTH_STRING}"
  PREFECT_LOGGING_LEVEL: "${PREFECT_LOGGING_LEVEL:-INFO}"

x-container-logging: &container-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  prefect-server:
    build:
      context: .
      dockerfile: Dockerfile.prefect
    image: ireland-gtfs-prefect:3.8.6
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      <<: *prefect-environment
      PREFECT_SERVER_API_AUTH_STRING: "${PREFECT_API_AUTH_STRING:?Set PREFECT_API_AUTH_STRING}"
      PREFECT_SERVER_API_CSRF_PROTECTION_ENABLED: "true"
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "${PREFECT_SERVER_DATABASE_CONNECTION_URL:?Set PREFECT_SERVER_DATABASE_CONNECTION_URL}"
      PREFECT_SERVER_UI_API_URL: "http://${PREFECT_PRIVATE_IP:?Set PREFECT_PRIVATE_IP}:${PREFECT_PORT:-4200}/api"
    ports:
      - "${PREFECT_PRIVATE_IP:?Set PREFECT_PRIVATE_IP}:${PREFECT_PORT:-4200}:4200"
    networks:
      - gtfs-shared
    mem_limit: 1g
    restart: unless-stopped
    logging: *container-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, requests; auth=os.environ['PREFECT_SERVER_API_AUTH_STRING'].split(':', 1); response=requests.get('http://127.0.0.1:4200/api/health', auth=tuple(auth), timeout=5); response.raise_for_status()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile.prefect
    image: ireland-gtfs-prefect:3.8.6
    command: ["/app/scripts/start-prefect-worker.sh"]
    environment:
      <<: *prefect-environment
      PREFECT_API_URL: "http://prefect-server:4200/api"
      PREFECT_WORK_POOL: "${PREFECT_WORK_POOL:-gtfs-local}"
      PREFECT_WORKER_WEBSERVER_HOST: "0.0.0.0"
      PREFECT_WORKER_WEBSERVER_PORT: "8080"
      POSTGRES_CONNECT_TIMEOUT_SECONDS: "${POSTGRES_CONNECT_TIMEOUT_SECONDS:-10}"
      POSTGRES_HOST: "${POSTGRES_HOST:?Set POSTGRES_HOST}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_SCHEMA: "${POSTGRES_SCHEMA:-gtfs}"
      POSTGRES_TABLE: "${POSTGRES_TABLE:-snapshots}"
      POSTGRES_SSLMODE: "${POSTGRES_SSLMODE:-prefer}"
      MINIO_ENDPOINT_URL: "${MINIO_ENDPOINT_URL:?Set MINIO_ENDPOINT_URL}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}"
      MINIO_BUCKET: "${MINIO_BUCKET:-gtfs-ireland}"
      MINIO_REGION: "${MINIO_REGION:-us-east-1}"
      ARCHIVE_PREFIX: "${ARCHIVE_PREFIX:-realtime}"
      ARCHIVE_TIMEZONE: "${ARCHIVE_TIMEZONE:-America/Sao_Paulo}"
      ARCHIVE_INITIAL_START: "${ARCHIVE_INITIAL_START:-2026-09-19T00:00:00-03:00}"
      ARCHIVE_MAX_CATCHUP_HOURS: "${ARCHIVE_MAX_CATCHUP_HOURS:-24}"
      FAILURE_WEBHOOK_URL: "${FAILURE_WEBHOOK_URL:-}"
    depends_on:
      prefect-server:
        condition: service_healthy
    networks:
      - gtfs-shared
    mem_limit: 1g
    restart: unless-stopped
    logging: *container-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  gtfs-shared:
    external: true
    name: "${GTFS_SHARED_NETWORK:-gtfs-shared}"
