[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ireland-gtfs-poller"
version = "0.1.0"
description = "Poll GTFS JSON data and persist snapshots to PostgreSQL."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "loguru>=0.7,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "uvicorn>=0.34,<1",
    "dbt-core (>=1.12.6,<2.0.0)",
    "dbt-duckdb (>=1.11.1,<2.0.0)",
    "sqlfluff-templater-dbt (>=4.4.0,<5.0.0)",
]

[project.optional-dependencies]
pipelines = [
    "duckdb>=1.1,<2",
    "prefect>=3.1,<4",
    "tzdata>=2024.1",
]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[project.scripts]
gtfs-poller = "poller.main:run"
gtfs-pipelines = "pipelines.serve:run"
gtfs-backfill = "pipelines.backfill:run"
gtfs-prefect-healthcheck = "pipelines.healthcheck:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

