ireland_gtfs:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: gtfs_dev.duckdb
      schema: z_dev
      settings:
        memory_limit: 8GB
        threads: 4
      extensions:
        - httpfs
        - parquet
      secrets:
        - type: s3
          key_id: "{{ env_var('MINIO_ACCESS_KEY') }}"
          secret: "{{ env_var('MINIO_SECRET_KEY') }}"
          endpoint: "{{ env_var('MINIO_ENDPOINT', 'localhost:9000') }}"
          region: "{{ env_var('MINIO_REGION', 'us-east-1') }}"
          url_style: path
          use_ssl: "{{ env_var('MINIO_USE_SSL', 'false') }}"
    prod:
      type: duckdb
      path: gtfs.duckdb
      settings:
        memory_limit: 8GB
        threads: 4
      extensions:
        - httpfs
        - parquet
      secrets:
        - type: s3
          key_id: "{{ env_var('MINIO_ACCESS_KEY') }}"
          secret: "{{ env_var('MINIO_SECRET_KEY') }}"
          endpoint: "{{ env_var('MINIO_ENDPOINT', 'localhost:9000') }}"
          region: "{{ env_var('MINIO_REGION', 'us-east-1') }}"
          url_style: path
          use_ssl: "{{ env_var('MINIO_USE_SSL', 'false') }}"
    stg:
      type: duckdb
      path: gtfs_stg.duckdb
      schema: z_stg
      # Prod is attached read-only so deferred refs resolve to gtfs.<schema>.<model>.
      attach:
        - path: "{{ env_var('PROD_DUCKDB_PATH', 'gtfs.duckdb') }}"
          alias: gtfs
          read_only: true
      settings:
        memory_limit: 2GB
        threads: 4
      extensions:
        - httpfs
        - parquet
      secrets:
        - type: s3
          key_id: "{{ env_var('MINIO_ACCESS_KEY') }}"
          secret: "{{ env_var('MINIO_SECRET_KEY') }}"
          endpoint: "{{ env_var('MINIO_ENDPOINT', 'localhost:9000') }}"
          region: "{{ env_var('MINIO_REGION', 'us-east-1') }}"
          url_style: path
          use_ssl: "{{ env_var('MINIO_USE_SSL', 'false') }}"
