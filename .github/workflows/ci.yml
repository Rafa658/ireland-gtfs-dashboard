name: dbt CI/CD Pipeline
run-name: dbt CI/CD Pipeline
on: [push]

jobs:
  setup-dbt-env:
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade poetry

      - name: Install Poetry dependencies
        run: |
          poetry install --extras pipelines

      - name: Lint SQL with SQLFluff
        run: poetry run sqlfluff lint models/

      - name: Build main manifest
        run: |
          git fetch --depth=1 origin main
          git worktree add ../main FETCH_HEAD
          poetry run dbt parse --project-dir ../main --target prod \
            --target-path "$PWD/artifacts/prod"

      # The homelab does the actual dbt run (stg target, deferring to its prod manifest).
      - name: dbt run on the homelab
        if: github.ref != 'refs/heads/main'
        run: poetry run prefect deployment run 'dbt-ci/dbt-ci' --param ref="$GITHUB_SHA" --watch

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: dbt-artifacts
          path: target/manifest.json