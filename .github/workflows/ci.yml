name: dbt CI/CD Pipeline
run-name: dbt CI/CD Pipeline
on: [push]

jobs:
  setup-dbt-env:
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade poetry

      - name: Install Poetry dependencies
        run: |
          poetry install

      - name: Lint SQL with SQLFluff
        run: poetry run sqlfluff lint models/

      - name: Run dbt build (slim CI example)
        run: dbt run --select state:modified+ --empty --defer --state ./

      - name: Upload artifacts/report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: dbt-artifacts
          path: target/